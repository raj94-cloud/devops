<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamFlix</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #141414; color: #fff; font-family: Arial, sans-serif; }

        .navbar {
            background: #000;
            padding: 15px 40px;
            display: flex;
            align-items: center;
            gap: 30px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .navbar h1 { color: #e50914; font-size: 28px; font-weight: bold; }
        .navbar input {
            padding: 8px 15px;
            border-radius: 4px;
            border: none;
            background: #333;
            color: #fff;
            width: 250px;
            font-size: 14px;
        }

        .hero {
            background: linear-gradient(to bottom, rgba(0,0,0,0.3), #141414),
                        url('https://image.tmdb.org/t/p/original/qJ2tW6WMUDux911r6m7haRef0WH.jpg') center/cover;
            height: 400px;
            display: flex;
            align-items: flex-end;
            padding: 40px;
        }
        .hero h2 { font-size: 48px; text-shadow: 2px 2px 8px #000; }
        .hero p { font-size: 16px; max-width: 500px; margin-top: 10px; color: #ccc; }
        .hero button {
            margin-top: 15px;
            padding: 10px 25px;
            background: #e50914;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }

        .section { padding: 20px 40px; }
        .section h3 { font-size: 20px; margin-bottom: 15px; color: #e5e5e5; }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
        }

        .movie-card {
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
            background: #1f1f1f;
        }
        .movie-card:hover { transform: scale(1.05); }
        .movie-card img { width: 100%; height: 270px; object-fit: cover; }
        .movie-info { padding: 10px; }
        .movie-info h4 { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .movie-info span { font-size: 12px; color: #aaa; }
        .rating { color: #f5c518; font-weight: bold; }
        .play-btn {
            display: block;
            width: 100%;
            margin-top: 8px;
            padding: 6px;
            background: #e50914;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }

        .genre-filters { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .genre-btn {
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid #555;
            background: transparent;
            color: #fff;
            cursor: pointer;
            font-size: 13px;
        }
        .genre-btn:hover, .genre-btn.active { background: #e50914; border-color: #e50914; }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 999;
            justify-content: center;
            align-items: center;
        }
        .modal.open { display: flex; }
        .modal-content {
            background: #1f1f1f;
            border-radius: 8px;
            width: 90%;
            max-width: 800px;
            overflow: hidden;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
        }
        .modal-header h3 { font-size: 20px; }
        .close-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
        }
        .modal iframe {
            width: 100%;
            height: 450px;
            border: none;
        }
    </style>
</head>
<body>

<nav class="navbar">
    <h1>StreamFlix</h1>
    <input type="text" id="search" placeholder="Search movies..." oninput="filterMovies()">
</nav>

<div class="hero">
    <div>
        <h2>The Dark Knight</h2>
        <p>Batman faces the Joker, a criminal mastermind who wants to plunge Gotham into anarchy.</p>
        <button onclick="openTrailer('https://www.youtube.com/embed/EXeTwQWrcwY', 'The Dark Knight')">▶ Play Trailer</button>
    </div>
</div>

<div class="section">
    <div class="genre-filters">
        <button class="genre-btn active" onclick="filterGenre('All', this)">All</button>
        <button class="genre-btn" onclick="filterGenre('Action', this)">Action</button>
        <button class="genre-btn" onclick="filterGenre('Sci-Fi', this)">Sci-Fi</button>
        <button class="genre-btn" onclick="filterGenre('Drama', this)">Drama</button>
    </div>

    <h3>🎬 All Movies</h3>
    <div class="movies-grid" id="movies-grid">
        {% for movie in movies %}
        <div class="movie-card" data-genre="{{ movie.genre }}" data-title="{{ movie.title }}">
            <img src="{{ movie.thumbnail }}" alt="{{ movie.title }}"
                 onerror="this.src='https://via.placeholder.com/180x270?text={{ movie.title }}'">
            <div class="movie-info">
                <h4>{{ movie.title }}</h4>
                <span>{{ movie.year }} • {{ movie.genre }}</span><br>
                <span class="rating">⭐ {{ movie.rating }}</span>
                <button class="play-btn" onclick="openTrailer('{{ movie.trailer }}', '{{ movie.title }}')">▶ Play Trailer</button>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

<!-- Video Modal -->
<div class="modal" id="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modal-title"></h3>
            <button class="close-btn" onclick="closeTrailer()">✕</button>
        </div>
        <iframe id="modal-iframe" src="" allowfullscreen allow="autoplay"></iframe>
    </div>
</div>

<script>
    function openTrailer(url, title) {
        document.getElementById('modal-title').textContent = title;
        document.getElementById('modal-iframe').src = url + '?autoplay=1';
        document.getElementById('modal').classList.add('open');
    }

    function closeTrailer() {
        document.getElementById('modal-iframe').src = '';
        document.getElementById('modal').classList.remove('open');
    }

    function filterMovies() {
        const q = document.getElementById('search').value.toLowerCase();
        document.querySelectorAll('.movie-card').forEach(card => {
            card.style.display = card.dataset.title.toLowerCase().includes(q) ? 'block' : 'none';
        });
    }

    function filterGenre(genre, btn) {
        document.querySelectorAll('.genre-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('.movie-card').forEach(card => {
            card.style.display = (genre === 'All' || card.dataset.genre === genre) ? 'block' : 'none';
        });
    }

    // Close modal on background click
    document.getElementById('modal').addEventListener('click', function(e) {
        if (e.target === this) closeTrailer();
    });
</script>

</body>
</html>
